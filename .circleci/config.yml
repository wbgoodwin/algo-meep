version: 2.1

orbs:
  go: circleci/go@1.11.0
  aws-cli: circleci/aws-cli@5.4.1
  node: circleci/node@7.1.0

jobs:
  backend-test:
    docker:
      - image: cimg/go:1.25
    working_directory: ~/project/backend
    steps:
      - checkout:
          path: ~/project
      - go/load-cache
      - go/mod-download
      - go/save-cache
      - run:
          name: Run unit tests
          command: go test ./... -v -count=1 -race -timeout 5m
      - run:
          name: Run coverage
          command: |
            go test ./... -coverprofile=coverage.out -count=1
            go tool cover -func=coverage.out
            go tool cover -func=coverage.out | tail -1
      - run:
          name: Enforce coverage threshold (90%)
          command: |
            TOTAL=$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}' | tr -d '%')
            echo "Total coverage: ${TOTAL}%"
            if [ "$(echo "${TOTAL} < 90.0" | bc -l)" -eq 1 ]; then
              echo "FAIL: Coverage ${TOTAL}% is below 90% threshold"
              exit 1
            fi
            echo "PASS: Coverage ${TOTAL}% meets 90% threshold"
      - store_artifacts:
          path: coverage.out
          destination: coverage/coverage.out
      - run:
          name: Generate HTML coverage report
          command: go tool cover -html=coverage.out -o coverage.html
      - store_artifacts:
          path: coverage.html
          destination: coverage/coverage.html

  backend-build:
    docker:
      - image: cimg/go:1.25
    working_directory: ~/project/backend
    steps:
      - checkout:
          path: ~/project
      - go/load-cache
      - go/mod-download
      - go/save-cache
      - run:
          name: Build for Linux ARM64 (Lambda target)
          command: GOOS=linux GOARCH=arm64 go build -o build/api/bootstrap ./cmd/api
      - run:
          name: Verify binary
          command: file build/api/bootstrap
      - persist_to_workspace:
          root: ~/project
          paths:
            - backend/build/api/bootstrap

  backend-lint:
    docker:
      - image: cimg/go:1.25
    working_directory: ~/project/backend
    steps:
      - checkout:
          path: ~/project
      - run:
          name: Install golangci-lint (from source for Go 1.25 compat)
          command: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.10.1
      - run:
          name: Run linter
          command: golangci-lint run ./...

  cdk-deploy:
    docker:
      - image: cimg/python:3.14-node
    working_directory: ~/project
    environment:
      AWS_REGION: us-east-1
    steps:
      - checkout
      - attach_workspace:
          at: ~/project
      - aws-cli/setup:
          role_arn: ${AWS_OIDC_ROLE_ARN}
          region: ${AWS_REGION}
          role_session_name: "circleci-cdk-deploy"
          session_duration: "1800"
      - run:
          name: Install CDK CLI
          command: sudo npm install -g aws-cdk
      - run:
          name: Install Python dependencies
          command: |
            cd infrastructure
            pip install -r requirements.txt 2>/dev/null || pip install aws-cdk-lib constructs python-dotenv "aws-cdk-aws-s3tables-alpha>=2.233.0a0"
      - run:
          name: Package Lambda artifact
          command: |
            mkdir -p infrastructure/cdk.out
            cd backend/build/api && zip -j ../../../infrastructure/cdk.out/api-bootstrap.zip bootstrap
      - run:
          name: CDK diff (preview changes)
          command: |
            cd infrastructure
            cdk diff AlgoFlow-Auth AlgoFlow-Data AlgoFlow-Api 2>&1 || true
      - run:
          name: CDK deploy
          command: |
            cd infrastructure
            cdk deploy AlgoFlow-Auth AlgoFlow-Data AlgoFlow-Api \
              --require-approval never \
              --outputs-file cdk-outputs.json
      - store_artifacts:
          path: infrastructure/cdk-outputs.json
          destination: cdk-outputs.json

workflows:
  backend:
    jobs:
      - backend-lint
      - backend-test
      - backend-build:
          requires:
            - backend-test
      - cdk-deploy:
          requires:
            - backend-lint
            - backend-build
          filters:
            branches:
              only: main
